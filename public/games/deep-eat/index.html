<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JZ 大鱼吃小鱼</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    background: #061018;

    color: #ffffff;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


/* =====================================================
   游戏容器
===================================================== */

.game-container {

    width: min(1150px, 100%);

    background: #0c161e;

    border: 1px solid #223743;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

}


/* =====================================================
   顶部
===================================================== */

.header {

    min-height: 72px;

    padding: 14px 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    border-bottom:
        1px solid #20333e;

}


.logo {

    font-size: 21px;

    font-weight: bold;

    white-space: nowrap;

}


.logo small {

    display: block;

    margin-top: 4px;

    color: #718792;

    font-size: 10px;

    font-weight: normal;

    letter-spacing: 1px;

}


/* =====================================================
   数据
===================================================== */

.stats {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    justify-content: flex-end;

}


.stat {

    background: #071117;

    border:
        1px solid #223743;

    border-radius: 9px;

    padding:
        8px 12px;

    color: #718792;

    font-size: 12px;

}


.stat strong {

    color: #ffffff;

    margin-left: 5px;

}


/* =====================================================
   游戏区域
===================================================== */

.game-wrapper {

    position: relative;

    width: 100%;

    background: #031018;

}


canvas {

    display: block;

    width: 100%;

    height: auto;

    touch-action: none;

    cursor: crosshair;

}


/* =====================================================
   开始界面
===================================================== */

.overlay {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(2,10,15,.84);

    backdrop-filter:
        blur(5px);

}


.panel {

    width:
        min(420px, 90%);

    padding: 32px;

    text-align: center;

    background: #0d1821;

    border:
        1px solid #294150;

    border-radius: 18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.4);

}


.panel h1 {

    margin:
        0 0 12px;

    font-size: 29px;

}


.panel p {

    color: #8197a3;

    font-size: 14px;

    line-height: 1.9;

    margin:
        0 0 22px;

}


.start-button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #e8f8ff;

    color: #071018;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;

    transition:
        .2s;

}


.start-button:hover {

    background: #ffffff;

    transform:
        translateY(-1px);

}


/* =====================================================
   底部
===================================================== */

.footer {

    padding:
        12px 18px;

    color: #607782;

    font-size: 12px;

    display: flex;

    justify-content: space-between;

    flex-wrap: wrap;

    gap: 10px;

}


/* =====================================================
   手机
===================================================== */

@media (max-width: 700px) {

    body {

        padding: 8px;

    }


    .game-container {

        border-radius: 14px;

    }


    .header {

        flex-direction: column;

        align-items: flex-start;

        padding: 13px;

    }


    .stats {

        justify-content: flex-start;

    }


    .logo {

        font-size: 18px;

    }

}

</style>

</head>


<body>


<div class="game-container">


    <!-- =================================================
         顶部
    ================================================== -->

    <div class="header">

        <div class="logo">

            🌊 JZ · 大鱼吃小鱼

            <small>
                EAT · GROW · SURVIVE
            </small>

        </div>


        <div class="stats">

            <div class="stat">

                体型

                <strong id="mass">
                    20
                </strong>

            </div>


            <div class="stat">

                得分

                <strong id="score">
                    0
                </strong>

            </div>


            <div class="stat">

                排名

                <strong id="rank">
                    1
                </strong>

            </div>


            <div class="stat">

                AI

                <strong id="fishCount">
                    50
                </strong>

            </div>

        </div>

    </div>


    <!-- =================================================
         游戏区域
    ================================================== -->

    <div class="game-wrapper">


        <canvas
            id="gameCanvas"
            width="1000"
            height="650"
        ></canvas>


        <!-- =================================================
             开始 / 结束界面
        ================================================== -->

        <div
            class="overlay"
            id="overlay"
        >

            <div class="panel">

                <h1 id="overlayTitle">

                    🐟 大鱼吃小鱼

                </h1>


                <p id="overlayText">

                    你是一条刚出生的小鱼。

                    <br>

                    吃掉 🦐 虾米和 🐟 小鱼不断成长。

                    <br>

                    AI 鱼也会自己吃东西成长。

                    <br>

                    小心那些比你大的 🦈 大鱼！

                </p>


                <button
                    class="start-button"
                    id="startButton"
                >

                    开始游戏

                </button>

            </div>

        </div>

    </div>


    <!-- =================================================
         底部
    ================================================== -->

    <div class="footer">

        <span>
            🖱️ 鼠标 / 👆 手指控制方向
        </span>

        <span>
            ⌨️ WASD / 方向键
        </span>

        <span>
            🦐 虾米 · 🐟 小鱼 · 🐠 大鱼
        </span>

    </div>


</div>



<script>

/* =====================================================
   Canvas
===================================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


const VIEW_WIDTH =
    canvas.width;

const VIEW_HEIGHT =
    canvas.height;


/* =====================================================
   世界
===================================================== */

const WORLD_WIDTH =
    4200;

const WORLD_HEIGHT =
    4200;


/* =====================================================
   数量
===================================================== */

const BOT_COUNT =
    50;

const FOOD_COUNT =
    220;


/* =====================================================
   游戏数据
===================================================== */

let player;

let bots = [];

let food = [];

let gameRunning =
    false;

let animationFrame =
    null;

let lastTime =
    0;

let score =
    0;


/* =====================================================
   摄像机
===================================================== */

const camera = {

    x: 0,

    y: 0

};


/* =====================================================
   鼠标 / 触摸
===================================================== */

const pointer = {

    x:
        VIEW_WIDTH / 2,

    y:
        VIEW_HEIGHT / 2,

    active:
        false

};


/* =====================================================
   键盘
===================================================== */

const keys = {};


/* =====================================================
   AI 颜色
===================================================== */

const FISH_COLORS = [

    "#ff6b6b",

    "#ff922b",

    "#ffd43b",

    "#69db7c",

    "#38d9a9",

    "#4dabf7",

    "#74c0fc",

    "#748ffc",

    "#9775fa",

    "#da77f2",

    "#f783ac"

];


/* =====================================================
   工具
===================================================== */

function random(min, max) {

    return (
        Math.random() *
        (max - min)
    ) + min;

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function distance(a, b) {

    return Math.hypot(

        a.x - b.x,

        a.y - b.y

    );

}


/* =====================================================
   体型转大小
===================================================== */

function fishSize(mass) {

    return (

        8 +
        Math.sqrt(mass) *
        3.6

    );

}


/* =====================================================
   体型转速度
===================================================== */

function fishSpeed(mass) {

    return clamp(

        5.6 -
        Math.sqrt(mass) *
        0.11,

        1.35,

        5.6

    );

}


/* =====================================================
   创建玩家
===================================================== */

function createPlayer() {

    return {

        x:
            WORLD_WIDTH / 2,

        y:
            WORLD_HEIGHT / 2,

        mass:
            20,

        size:
            fishSize(20),

        color:
            "#20d878",

        angle:
            0,

        wiggle:
            0

    };

}


/* =====================================================
   创建 AI
===================================================== */

function createBot(id) {

    let mass;


    const type =
        Math.random();


    /*
        65% 小鱼
    */

    if (
        type < .65
    ) {

        mass =
            random(
                5,
                25
            );

    }

    /*
        25% 中型鱼
    */

    else if (
        type < .90
    ) {

        mass =
            random(
                25,
                65
            );

    }

    /*
        10% 大鱼
    */

    else {

        mass =
            random(
                65,
                130
            );

    }


    return {

        id:

            id,

        x:

            random(
                100,
                WORLD_WIDTH - 100
            ),

        y:

            random(
                100,
                WORLD_HEIGHT - 100
            ),

        mass:

            mass,

        size:

            fishSize(
                mass
            ),

        color:

            FISH_COLORS[
                id %
                FISH_COLORS.length
            ],

        angle:

            random(
                0,
                Math.PI * 2
            ),

        state:

            "wander",

        targetX:

            null,

        targetY:

            null,

        timer:

            random(
                1,
                4
            ),

        wiggle:

            random(
                0,
                Math.PI * 2
            )

    };

}


/* =====================================================
   创建食物
===================================================== */

function createFood() {

    /*
        75% 虾米
        25% 小鱼
    */

    const shrimp =
        Math.random() < .75;


    return {

        x:

            random(
                40,
                WORLD_WIDTH - 40
            ),

        y:

            random(
                40,
                WORLD_HEIGHT - 40
            ),

        type:

            shrimp
                ? "shrimp"
                : "smallfish",

        mass:

            shrimp
                ? random(1, 3)
                : random(3, 8),

        size:

            shrimp
                ? random(3, 6)
                : random(6, 10),

        angle:

            random(
                0,
                Math.PI * 2
            ),

        wiggle:

            random(
                0,
                Math.PI * 2
            ),

        timer:

            random(
                .5,
                3
            )

    };

}


/* =====================================================
   初始化
===================================================== */

function initGame() {

    player =
        createPlayer();


    bots = [];

    food = [];


    score = 0;


    /*
        AI
    */

    for (
        let i = 0;
        i < BOT_COUNT;
        i++
    ) {

        bots.push(
            createBot(i)
        );

    }


    /*
        食物
    */

    for (
        let i = 0;
        i < FOOD_COUNT;
        i++
    ) {

        food.push(
            createFood()
        );

    }


    /*
        摄像机
    */

    camera.x =
        player.x -
        VIEW_WIDTH / 2;

    camera.y =
        player.y -
        VIEW_HEIGHT / 2;


    updateUI();

}


/* =====================================================
   玩家移动
===================================================== */

function updatePlayer(dt) {

    let dx = 0;

    let dy = 0;


    /*
        键盘
    */

    if (
        keys["w"] ||
        keys["W"] ||
        keys["ArrowUp"]
    ) {

        dy--;

    }


    if (
        keys["s"] ||
        keys["S"] ||
        keys["ArrowDown"]
    ) {

        dy++;

    }


    if (
        keys["a"] ||
        keys["A"] ||
        keys["ArrowLeft"]
    ) {

        dx--;

    }


    if (
        keys["d"] ||
        keys["D"] ||
        keys["ArrowRight"]
    ) {

        dx++;

    }


    /*
        如果没有键盘输入
        使用鼠标
    */

    if (
        dx === 0 &&
        dy === 0 &&
        pointer.active
    ) {

        dx =
            pointer.x -
            VIEW_WIDTH / 2;

        dy =
            pointer.y -
            VIEW_HEIGHT / 2;

    }


    const len =
        Math.hypot(
            dx,
            dy
        );


    if (
        len > 5
    ) {

        dx /=
            len;

        dy /=
            len;


        const speed =
            fishSpeed(
                player.mass
            );


        player.x +=
            dx *
            speed *
            dt *
            60;


        player.y +=
            dy *
            speed *
            dt *
            60;


        player.angle =
            Math.atan2(
                dy,
                dx
            );

    }


    /*
        地图边界
    */

    player.x =
        clamp(

            player.x,

            player.size,

            WORLD_WIDTH -
            player.size

        );


    player.y =
        clamp(

            player.y,

            player.size,

            WORLD_HEIGHT -
            player.size

        );


    /*
        鱼尾动画
    */

    player.wiggle +=
        dt * 8;


    /*
        摄像机
    */

    camera.x =
        player.x -
        VIEW_WIDTH / 2;

    camera.y =
        player.y -
        VIEW_HEIGHT / 2;


    camera.x =
        clamp(

            camera.x,

            0,

            WORLD_WIDTH -
            VIEW_WIDTH

        );


    camera.y =
        clamp(

            camera.y,

            0,

            WORLD_HEIGHT -
            VIEW_HEIGHT

        );

}


/* =====================================================
   找最近可以吃的鱼
===================================================== */

function findNearestPrey(bot) {

    let target =
        null;

    let nearest =
        Infinity;


    /*
        玩家
    */

    if (
        player.mass <
        bot.mass * 0.86
    ) {

        const d =
            distance(
                bot,
                player
            );


        if (
            d < nearest
        ) {

            target =
                player;

            nearest =
                d;

        }

    }


    /*
        AI
    */

    for (
        const other of bots
    ) {

        if (
            other === bot
        ) {

            continue;

        }


        if (
            other.mass >=
            bot.mass * .86
        ) {

            continue;

        }


        const d =
            distance(
                bot,
                other
            );


        if (
            d < nearest
        ) {

            target =
                other;

            nearest =
                d;

        }

    }


    return target;

}


/* =====================================================
   找危险
===================================================== */

function findNearestDanger(bot) {

    let danger =
        null;

    let nearest =
        Infinity;


    /*
        玩家
    */

    if (
        player.mass >
        bot.mass * 1.15
    ) {

        const d =
            distance(
                bot,
                player
            );


        if (
            d < nearest
        ) {

            danger =
                player;

            nearest =
                d;

        }

    }


    /*
        AI
    */

    for (
        const other of bots
    ) {

        if (
            other === bot
        ) {

            continue;

        }


        if (
            other.mass <=
            bot.mass * 1.15
        ) {

            continue;

        }


        const d =
            distance(
                bot,
                other
            );


        if (
            d < nearest
        ) {

            danger =
                other;

            nearest =
                d;

        }

    }


    return danger;

}


/* =====================================================
   找最近食物
===================================================== */

function findNearestFood(bot) {

    let target =
        null;

    let nearest =
        Infinity;


    for (
        const item of food
    ) {

        /*
            只有食物明显小于自己
        */

        if (
            item.mass >=
            bot.mass * .8
        ) {

            continue;

        }


        const d =
            distance(
                bot,
                item
            );


        if (
            d < nearest
        ) {

            target =
                item;

            nearest =
                d;

        }

    }


    return target;

}


/* =====================================================
   鱼群中心
===================================================== */

function getSchoolCenter(bot) {

    let x = 0;

    let y = 0;

    let count = 0;


    for (
        const other of bots
    ) {

        if (
            other === bot
        ) {

            continue;

        }


        const d =
            distance(
                bot,
                other
            );


        /*
            300 范围内
        */

        if (
            d < 300
        ) {

            x +=
                other.x;

            y +=
                other.y;

            count++;

        }

    }


    if (
        count === 0
    ) {

        return null;

    }


    return {

        x:
            x / count,

        y:
            y / count

    };

}


/* =====================================================
   AI 更新
===================================================== */

function updateBot(
    bot,
    dt
) {

    bot.wiggle +=
        dt * 8;


    /*
        =================================================
        第一优先级：逃命
        =================================================
    */

    const danger =
        findNearestDanger(
            bot
        );


    if (
        danger
    ) {

        bot.state =
            "flee";


        const dx =
            bot.x -
            danger.x;


        const dy =
            bot.y -
            danger.y;


        const len =
            Math.hypot(
                dx,
                dy
            ) || 1;


        bot.targetX =
            bot.x +
            dx /
            len *
            700;


        bot.targetY =
            bot.y +
            dy /
            len *
            700;

    }

    else {

        /*
            =================================================
            第二优先级：捕猎
            =================================================
        */

        const prey =
            findNearestPrey(
                bot
            );


        if (
            prey &&
            distance(
                bot,
                prey
            ) < 750
        ) {

            bot.state =
                "chase";


            bot.targetX =
                prey.x;

            bot.targetY =
                prey.y;

        }

        else {

            /*
                =================================================
                第三优先级：吃东西
                =================================================
            */

            const foodTarget =
                findNearestFood(
                    bot
                );


            if (
                foodTarget &&
                distance(
                    bot,
                    foodTarget
                ) < 600
            ) {

                bot.state =
                    "food";


                bot.targetX =
                    foodTarget.x;

                bot.targetY =
                    foodTarget.y;

            }

            else {

                /*
                    =================================================
                    第四优先级：鱼群
                    =================================================
                */

                const school =
                    getSchoolCenter(
                        bot
                    );


                if (
                    school
                ) {

                    const dx =
                        school.x -
                        bot.x;


                    const dy =
                        school.y -
                        bot.y;


                    const d =
                        Math.hypot(
                            dx,
                            dy
                        );


                    /*
                        太远 → 回群
                    */

                    if (
                        d > 120
                    ) {

                        bot.state =
                            "school";


                        bot.targetX =
                            school.x;

                        bot.targetY =
                            school.y;

                    }

                    else {

                        bot.state =
                            "wander";

                    }

                }

                else {

                    bot.state =
                        "wander";

                }

            }

        }

    }


    /*
        =================================================
        转向
        =================================================
    */

    if (
        bot.state !==
        "wander"
    ) {

        const dx =
            bot.targetX -
            bot.x;


        const dy =
            bot.targetY -
            bot.y;


        const targetAngle =
            Math.atan2(
                dy,
                dx
            );


        let diff =
            targetAngle -
            bot.angle;


        while (
            diff > Math.PI
        ) {

            diff -=
                Math.PI * 2;

        }


        while (
            diff < -Math.PI
        ) {

            diff +=
                Math.PI * 2;

        }


        /*
            鱼越大
            转弯越慢
        */

        const turnSpeed =
            clamp(

                .13 -
                bot.mass *
                .00025,

                .045,

                .13

            );


        bot.angle +=
            clamp(
                diff,
                -turnSpeed,
                turnSpeed
            );

    }

    else {

        /*
            随机游动
        */

        bot.timer -=
            dt;


        if (
            bot.timer <= 0
        ) {

            bot.timer =
                random(
                    .8,
                    3.5
                );


            bot.angle +=
                random(
                    -.8,
                    .8
                );

        }

    }


    /*
        =================================================
        移动
        =================================================
    */

    const speed =
        fishSpeed(
            bot.mass
        );


    bot.x +=
        Math.cos(
            bot.angle
        ) *
        speed *
        dt *
        60;


    bot.y +=
        Math.sin(
            bot.angle
        ) *
        speed *
        dt *
        60;


    /*
        边界反弹
    */

    if (
        bot.x <
        bot.size
    ) {

        bot.x =
            bot.size;

        bot.angle =
            0;

    }


    if (
        bot.x >
        WORLD_WIDTH -
        bot.size
    ) {

        bot.x =
            WORLD_WIDTH -
            bot.size;

        bot.angle =
            Math.PI;

    }


    if (
        bot.y <
        bot.size
    ) {

        bot.y =
            bot.size;

        bot.angle =
            Math.PI / 2;

    }


    if (
        bot.y >
        WORLD_HEIGHT -
        bot.size
    ) {

        bot.y =
            WORLD_HEIGHT -
            bot.size;

        bot.angle =
            -Math.PI / 2;

    }


    bot.size =
        fishSize(
            bot.mass
        );

}


/* =====================================================
   食物移动
===================================================== */

function updateFood(dt) {

    for (
        const item of food
    ) {

        item.wiggle +=
            dt * 7;


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                random(
                    .5,
                    3
                );


            item.angle +=
                random(
                    -.7,
                    .7
                );

        }


        /*
            小虾速度稍慢
        */

        const speed =
            item.type === "shrimp"
                ? 1.4
                : 2.1;


        item.x +=
            Math.cos(
                item.angle
            ) *
            speed *
            dt *
            60;


        item.y +=
            Math.sin(
                item.angle
            ) *
            speed *
            dt *
            60;


        /*
            边界
        */

        if (
            item.x < 20 ||
            item.x >
                WORLD_WIDTH - 20
        ) {

            item.angle =
                Math.PI -
                item.angle;

            item.x =
                clamp(
                    item.x,
                    20,
                    WORLD_WIDTH - 20
                );

        }


        if (
            item.y < 20 ||
            item.y >
                WORLD_HEIGHT - 20
        ) {

            item.angle =
                -item.angle;

            item.y =
                clamp(
                    item.y,
                    20,
                    WORLD_HEIGHT - 20
                );

        }

    }

}


/* =====================================================
   能否吃
===================================================== */

function canEat(
    eater,
    victim
) {

    return (

        eater.mass >
        victim.mass * 1.15 &&

        distance(
            eater,
            victim
        ) <
        eater.size * .9

    );

}


/* =====================================================
   玩家吃食物
===================================================== */

function playerEatFood() {

    for (
        let i =
            food.length - 1;

        i >= 0;

        i--
    ) {

        const item =
            food[i];


        if (
            player.mass >
            item.mass * 1.05 &&

            distance(
                player,
                item
            ) <
            player.size +
            item.size
        ) {

            /*
                成长
            */

            player.mass +=
                item.mass;


            player.size =
                fishSize(
                    player.mass
                );


            /*
                得分
            */

            score +=
                Math.max(
                    1,
                    Math.floor(
                        item.mass * 10
                    )
                );


            /*
                删除食物
            */

            food.splice(
                i,
                1
            );


            /*
                补新的食物
            */

            food.push(
                createFood()
            );

        }

    }

}


/* =====================================================
   AI 吃食物
===================================================== */

function aiEatFood() {

    for (
        const bot of bots
    ) {

        for (
            let i =
                food.length - 1;

            i >= 0;

            i--
        ) {

            const item =
                food[i];


            if (
                bot.mass >
                item.mass * 1.05 &&

                distance(
                    bot,
                    item
                ) <
                bot.size +
                item.size
            ) {

                /*
                    AI 成长
                */

                bot.mass +=
                    item.mass;


                bot.size =
                    fishSize(
                        bot.mass
                    );


                food.splice(
                    i,
                    1
                );


                /*
                    补食物
                */

                food.push(
                    createFood()
                );

            }

        }

    }

}


/* =====================================================
   玩家与 AI 互吃
===================================================== */

function playerAndAIEat() {

    for (
        let i =
            bots.length - 1;

        i >= 0;

        i--
    ) {

        const bot =
            bots[i];


        /*
            玩家吃 AI
        */

        if (
            canEat(
                player,
                bot
            )
        ) {

            player.mass +=
                bot.mass *
                .85;


            player.size =
                fishSize(
                    player.mass
                );


            score +=
                Math.floor(
                    bot.mass * 20
                );


            bots.splice(
                i,
                1
            );


            bots.push(
                createBot(
                    Date.now() +
                    i
                )
            );


            continue;

        }


        /*
            AI 吃玩家
        */

        if (
            canEat(
                bot,
                player
            )
        ) {

            gameOver(

                "🦈 你被 " +
                "AI 大鱼吃掉了！"

            );

            return;

        }

    }

}


/* =====================================================
   AI 互相捕食
===================================================== */

function aiEatEachOther() {

    /*
        一帧只处理少量
        防止 50 条鱼产生大量计算
    */

    for (
        let attempt = 0;
        attempt < 12;
        attempt++
    ) {

        if (
            bots.length < 2
        ) {

            return;

        }


        const i =
            Math.floor(
                Math.random() *
                bots.length
            );


        const j =
            Math.floor(
                Math.random() *
                bots.length
            );


        if (
            i === j
        ) {

            continue;

        }


        const a =
            bots[i];

        const b =
            bots[j];


        if (
            !a ||
            !b
        ) {

            continue;

        }


        /*
            距离太远
        */

        if (
            distance(
                a,
                b
            ) >
            Math.max(
                a.size,
                b.size
            ) * 2.8
        ) {

            continue;

        }


        /*
            A 吃 B
        */

        if (
            canEat(
                a,
                b
            )
        ) {

            a.mass +=
                b.mass * .8;


            a.size =
                fishSize(
                    a.mass
                );


            bots.splice(
                j,
                1
            );


            bots.push(
                createBot(
                    Date.now()
                )
            );


            continue;

        }


        /*
            B 吃 A
        */

        if (
            canEat(
                b,
                a
            )
        ) {

            b.mass +=
                a.mass * .8;


            b.size =
                fishSize(
                    b.mass
                );


            bots.splice(
                i,
                1
            );


            bots.push(
                createBot(
                    Date.now()
                )
            );

        }

    }

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    if (!player) {

        return;

    }


    document
        .getElementById(
            "mass"
        )
        .textContent =
        Math.floor(
            player.mass
        );


    document
        .getElementById(
            "score"
        )
        .textContent =
        score;


    /*
        排名
    */

    const all =
        [
            player,
            ...bots
        ];


    all.sort(
        (a, b) =>
            b.mass -
            a.mass
    );


    const rank =
        all.indexOf(
            player
        ) + 1;


    document
        .getElementById(
            "rank"
        )
        .textContent =
        rank;


    document
        .getElementById(
            "fishCount"
        )
        .textContent =
        bots.length;

}


/* =====================================================
   海洋背景
===================================================== */

function drawBackground() {

    /*
        背景
    */

    ctx.fillStyle =
        "#041722";


    ctx.fillRect(

        0,

        0,

        VIEW_WIDTH,

        VIEW_HEIGHT

    );


    /*
        海洋渐变
    */

    const gradient =
        ctx.createLinearGradient(

            0,

            0,

            0,

            VIEW_HEIGHT

        );


    gradient.addColorStop(
        0,
        "rgba(10,55,75,.25)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,10,18,.25)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(

        0,

        0,

        VIEW_WIDTH,

        VIEW_HEIGHT

    );


    /*
        网格
    */

    const grid =
        120;


    ctx.strokeStyle =
        "rgba(100,200,230,.035)";


    ctx.lineWidth =
        1;


    const startX =
        Math.floor(
            camera.x /
            grid
        ) *
        grid;


    const startY =
        Math.floor(
            camera.y /
            grid
        ) *
        grid;


    for (
        let x =
            startX;

        x <
            camera.x +
            VIEW_WIDTH +
            grid;

        x +=
            grid
    ) {

        ctx.beginPath();

        ctx.moveTo(

            x -
            camera.x,

            0

        );

        ctx.lineTo(

            x -
            camera.x,

            VIEW_HEIGHT

        );

        ctx.stroke();

    }


    for (
        let y =
            startY;

        y <
            camera.y +
            VIEW_HEIGHT +
            grid;

        y +=
            grid
    ) {

        ctx.beginPath();

        ctx.moveTo(

            0,

            y -
            camera.y

        );

        ctx.lineTo(

            VIEW_WIDTH,

            y -
            camera.y

        );

        ctx.stroke();

    }


    /*
        气泡
    */

    for (
        let i = 0;
        i < 50;
        i++
    ) {

        const worldX =
            (
                i * 317
            ) %
            WORLD_WIDTH;


        const worldY =
            (
                i * 211
            ) %
            WORLD_HEIGHT;


        const x =
            worldX -
            camera.x;


        const y =
            worldY -
            camera.y;


        if (
            x < -20 ||
            x > VIEW_WIDTH + 20 ||
            y < -20 ||
            y > VIEW_HEIGHT + 20
        ) {

            continue;

        }


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            2 +
            i % 4,

            0,

            Math.PI * 2

        );


        ctx.strokeStyle =
            "rgba(130,220,245,.13)";


        ctx.stroke();

    }

}


/* =====================================================
   绘制虾米 / 小鱼
===================================================== */

function drawFood(item) {

    const x =
        item.x -
        camera.x;


    const y =
        item.y -
        camera.y;


    if (
        x < -40 ||
        x > VIEW_WIDTH + 40 ||
        y < -40 ||
        y > VIEW_HEIGHT + 40
    ) {

        return;

    }


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        item.angle
    );


    /*
        =================================================
        虾米
        =================================================
    */

    if (
        item.type === "shrimp"
    ) {

        const wave =
            Math.sin(
                item.wiggle
            ) *
            item.size *
            .15;


        /*
            身体
        */

        ctx.strokeStyle =
            "#ffad83";


        ctx.lineWidth =
            2;


        ctx.beginPath();


        ctx.arc(

            0,

            0,

            item.size,

            -.7,

            Math.PI * 1.4

        );


        ctx.stroke();


        /*
            尾巴
        */

        ctx.beginPath();


        ctx.moveTo(

            -item.size * .6,

            0

        );


        ctx.lineTo(

            -item.size * 1.5,

            -item.size * .7 +
            wave

        );


        ctx.lineTo(

            -item.size * 1.5,

            item.size * .7 +
            wave

        );


        ctx.stroke();


        /*
            虾须
        */

        ctx.beginPath();


        ctx.moveTo(

            item.size * .3,

            -item.size * .3

        );


        ctx.lineTo(

            item.size * 1.5,

            -item.size * .9

        );


        ctx.moveTo(

            item.size * .3,

            item.size * .3

        );


        ctx.lineTo(

            item.size * 1.5,

            item.size * .9

        );


        ctx.stroke();


    }


    /*
        =================================================
        小鱼
        =================================================
    */

    else {

        ctx.fillStyle =
            "#6ec9e8";


        ctx.beginPath();


        ctx.ellipse(

            0,

            0,

            item.size,

            item.size * .55,

            0,

            0,

            Math.PI * 2

        );


        ctx.fill();


        /*
            尾巴
        */

        ctx.beginPath();


        ctx.moveTo(

            -item.size * .6,

            0

        );


        ctx.lineTo(

            -item.size * 1.3,

            -item.size * .6

        );


        ctx.lineTo(

            -item.size * 1.3,

            item.size * .6

        );


        ctx.closePath();


        ctx.fill();


        /*
            眼睛
        */

        ctx.beginPath();


        ctx.arc(

            item.size * .45,

            -item.size * .2,

            item.size * .1,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            "#111";


        ctx.fill();

    }


    ctx.restore();

}


/* =====================================================
   绘制鱼
===================================================== */

function drawFish(
    fish,
    isPlayer = false
) {

    const x =
        fish.x -
        camera.x;


    const y =
        fish.y -
        camera.y;


    /*
        屏幕外不画
    */

    if (
        x <
            -fish.size * 3 ||

        x >
            VIEW_WIDTH +
            fish.size * 3 ||

        y <
            -fish.size * 3 ||

        y >
            VIEW_HEIGHT +
            fish.size * 3
    ) {

        return;

    }


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        fish.angle
    );


    /*
        尾巴动画
    */

    const wave =
        Math.sin(
            fish.wiggle
        ) *
        fish.size *
        .15;


    /*
        =================================================
        尾巴
        =================================================
    */

    ctx.beginPath();


    ctx.moveTo(

        -fish.size * .55,

        0

    );


    ctx.lineTo(

        -fish.size * 1.15,

        -fish.size * .65 +
        wave

    );


    ctx.lineTo(

        -fish.size * 1.15,

        fish.size * .65 +
        wave

    );


    ctx.closePath();


    ctx.fillStyle =
        fish.color;


    ctx.fill();


    /*
        =================================================
        鱼身渐变
        =================================================
    */

    const gradient =
        ctx.createRadialGradient(

            fish.size * .3,

            -fish.size * .3,

            fish.size * .05,

            0,

            0,

            fish.size

        );


    gradient.addColorStop(
        0,
        "#ffffff"
    );


    gradient.addColorStop(
        .13,
        fish.color
    );


    gradient.addColorStop(
        1,
        fish.color
    );


    /*
        =================================================
        鱼身体
        =================================================
    */

    ctx.beginPath();


    ctx.ellipse(

        0,

        0,

        fish.size,

        fish.size * .62,

        0,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        gradient;


    ctx.fill();


    /*
        =================================================
        鱼鳍
        =================================================
    */

    ctx.beginPath();


    ctx.moveTo(

        -fish.size * .1,

        -fish.size * .38

    );


    ctx.lineTo(

        fish.size * .2,

        -fish.size * .9

    );


    ctx.lineTo(

        fish.size * .45,

        -fish.size * .2

    );


    ctx.closePath();


    ctx.fillStyle =
        fish.color;


    ctx.fill();


    /*
        =================================================
        眼睛
        =================================================
    */

    ctx.beginPath();


    ctx.arc(

        fish.size * .55,

        -fish.size * .22,

        fish.size * .13,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "#ffffff";


    ctx.fill();


    ctx.beginPath();


    ctx.arc(

        fish.size * .59,

        -fish.size * .22,

        fish.size * .06,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "#111111";


    ctx.fill();


    /*
        =================================================
        玩家外圈
        =================================================
    */

    if (
        isPlayer
    ) {

        ctx.beginPath();


        ctx.ellipse(

            0,

            0,

            fish.size * 1.18,

            fish.size * .78,

            0,

            0,

            Math.PI * 2

        );


        ctx.strokeStyle =
            "rgba(32,216,120,.4)";


        ctx.lineWidth =
            3;


        ctx.stroke();

    }


    ctx.restore();


    /*
        =================================================
        名字
        =================================================
    */

    ctx.textAlign =
        "center";


    if (
        isPlayer
    ) {

        ctx.font =
            "bold 12px Arial";


        ctx.fillStyle =
            "#ffffff";


        ctx.fillText(

            "YOU",

            x,

            y -
            fish.size -
            8

        );

    }

}


/* =====================================================
   小地图
===================================================== */

function drawMinimap() {

    const size =
        145;


    const margin =
        15;


    const x =
        VIEW_WIDTH -
        size -
        margin;


    const y =
        margin;


    /*
        背景
    */

    ctx.fillStyle =
        "rgba(2,12,18,.86)";


    ctx.fillRect(

        x,

        y,

        size,

        size

    );


    ctx.strokeStyle =
        "rgba(255,255,255,.22)";


    ctx.strokeRect(

        x,

        y,

        size,

        size

    );


    /*
        食物
    */

    for (
        const item of food
    ) {

        ctx.beginPath();


        ctx.arc(

            x +
            item.x /
            WORLD_WIDTH *
            size,

            y +
            item.y /
            WORLD_HEIGHT *
            size,

            1,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            item.type === "shrimp"
                ? "#ffad83"
                : "#6ec9e8";


        ctx.fill();

    }


    /*
        AI
    */

    for (
        const fish of bots
    ) {

        ctx.beginPath();


        ctx.arc(

            x +
            fish.x /
            WORLD_WIDTH *
            size,

            y +
            fish.y /
            WORLD_HEIGHT *
            size,

            clamp(
                fish.mass / 30,
                1.5,
                4
            ),

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            fish.color;


        ctx.fill();

    }


    /*
        玩家
    */

    ctx.beginPath();


    ctx.arc(

        x +
        player.x /
        WORLD_WIDTH *
        size,

        y +
        player.y /
        WORLD_HEIGHT *
        size,

        4,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "#20d878";


    ctx.fill();


    /*
        玩家视野
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.3)";


    ctx.strokeRect(

        x +
        camera.x /
        WORLD_WIDTH *
        size,

        y +
        camera.y /
        WORLD_HEIGHT *
        size,

        VIEW_WIDTH /
        WORLD_WIDTH *
        size,

        VIEW_HEIGHT /
        WORLD_HEIGHT *
        size

    );

}


/* =====================================================
   绘制
===================================================== */

function draw() {

    /*
        背景
    */

    drawBackground();


    /*
        食物
    */

    for (
        const item of food
    ) {

        drawFood(
            item
        );

    }


    /*
        AI
    */

    /*
        先画小鱼
        大鱼覆盖在上面
    */

    const sortedBots =
        [...bots].sort(
            (a, b) =>
                a.mass -
                b.mass
        );


    for (
        const fish of sortedBots
    ) {

        drawFish(
            fish,
            false
        );

    }


    /*
        玩家最后绘制
    */

    drawFish(
        player,
        true
    );


    /*
        小地图
    */

    drawMinimap();

}


/* =====================================================
   游戏循环
===================================================== */

function gameLoop(
    timestamp
) {

    if (
        !gameRunning
    ) {

        return;

    }


    /*
        delta time
    */

    const dt =
        Math.min(

            (
                timestamp -
                lastTime
            ) / 1000,

            .035

        );


    lastTime =
        timestamp;


    /*
        玩家
    */

    updatePlayer(
        dt
    );


    /*
        食物
    */

    updateFood(
        dt
    );


    /*
        AI
    */

    for (
        const bot of bots
    ) {

        updateBot(
            bot,
            dt
        );

    }


    /*
        吃食物
    */

    playerEatFood();


    aiEatFood();


    /*
        玩家 / AI
    */

    playerAndAIEat();


    if (
        !gameRunning
    ) {

        return;

    }


    /*
        AI 互相吃
    */

    aiEatEachOther();


    /*
        UI
    */

    updateUI();


    /*
        绘制
    */

    draw();


    /*
        下一帧
    */

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   开始游戏
===================================================== */

function startGame() {

    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );

    }


    initGame();


    gameRunning =
        true;


    document
        .getElementById(
            "overlay"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "startButton"
        )
        .textContent =
        "开始游戏";


    lastTime =
        performance.now();


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   游戏结束
===================================================== */

function gameOver(
    reason
) {

    gameRunning =
        false;


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );

    }


    document
        .getElementById(
            "overlayTitle"
        )
        .textContent =
        "💀 游戏结束";


    document
        .getElementById(
            "overlayText"
        )
        .innerHTML =

        reason +

        "<br><br>" +

        "最终得分：<b>" +

        score +

        "</b>" +

        "<br>" +

        "最终体型：<b>" +

        Math.floor(
            player.mass
        ) +

        "</b>";


    document
        .getElementById(
            "startButton"
        )
        .textContent =
        "再来一局";


    document
        .getElementById(
            "overlay"
        )
        .style.display =
        "flex";

}


/* =====================================================
   鼠标 / 触摸
===================================================== */

function updatePointer(
    event
) {

    const rect =
        canvas.getBoundingClientRect();


    pointer.x =

        (
            event.clientX -
            rect.left
        ) *
        VIEW_WIDTH /
        rect.width;


    pointer.y =

        (
            event.clientY -
            rect.top
        ) *
        VIEW_HEIGHT /
        rect.height;


    pointer.active =
        true;

}


/*
    鼠标
*/

canvas.addEventListener(

    "pointermove",

    updatePointer

);


canvas.addEventListener(

    "pointerdown",

    updatePointer

);


/*
    离开画布
*/

canvas.addEventListener(

    "pointerleave",

    function() {

        pointer.active =
            false;

    }

);


/* =====================================================
   键盘
===================================================== */

window.addEventListener(

    "keydown",

    function(event) {

        keys[event.key] =
            true;


        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                " "
            ].includes(
                event.key
            )
        ) {

            event.preventDefault();

        }

    }

);


window.addEventListener(

    "keyup",

    function(event) {

        keys[event.key] =
            false;

    }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>汉诺塔 · 拖拽挑战</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(circle at 20% 15%, #263b72 0%, transparent 35%),
        radial-gradient(circle at 85% 85%, #342066 0%, transparent 35%),
        linear-gradient(135deg, #070a17, #10162d 50%, #080a16);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 18px;

    overflow-x: hidden;
}

.game {
    width: min(1100px, 100%);

    padding: 24px;

    border-radius: 26px;

    background: rgba(255,255,255,.065);

    border: 1px solid rgba(255,255,255,.11);

    box-shadow:
        0 30px 90px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.08);

    backdrop-filter: blur(18px);
}

/* =========================
   标题
========================= */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    font-size: clamp(32px, 5vw, 50px);

    letter-spacing: 5px;

    background:
        linear-gradient(
            90deg,
            #63e7ff,
            #9b7bff,
            #ff72c8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.header p {
    margin-top: 7px;

    color: #8995b8;

    font-size: 13px;

    letter-spacing: 2px;
}

/* =========================
   控制
========================= */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 18px;
}

.control-item {
    padding: 9px 13px;

    border-radius: 12px;

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,255,255,.08);

    color: #c5cde5;

    font-size: 14px;
}

select {
    margin-left: 5px;

    padding: 5px 9px;

    border-radius: 8px;

    background: #161d38;

    color: white;

    border: 1px solid #3b4769;

    outline: none;
}

button {
    border: none;

    padding: 10px 16px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #506aff,
            #8058ff
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

    box-shadow:
        0 6px 18px rgba(80,100,255,.22);
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
}

button:active {
    transform: scale(.96);
}

/* =========================
   数据
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    margin-bottom: 18px;
}

.stat {
    text-align: center;

    padding: 12px;

    border-radius: 14px;

    background: rgba(0,0,0,.19);

    border: 1px solid rgba(255,255,255,.055);
}

.stat-label {
    font-size: 11px;

    color: #7884a6;
}

.stat-value {
    margin-top: 4px;

    font-size: 21px;

    font-weight: bold;
}

/* =========================
   游戏棋盘
========================= */

.board {
    position: relative;

    height: 470px;

    overflow: hidden;

    border-radius: 22px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(120,150,255,.07),
            transparent 55%
        ),
        linear-gradient(
            180deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.008)
        );

    border: 1px solid rgba(255,255,255,.075);

    user-select: none;

    touch-action: none;
}

/* 地面 */

.floor {
    position: absolute;

    left: 5%;
    right: 5%;

    bottom: 47px;

    height: 9px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #394a72,
            #8b9bc9,
            #394a72
        );

    box-shadow:
        0 0 18px rgba(120,150,255,.28);

    z-index: 1;
}

/* =========================
   柱子区域
========================= */

.rod-area {
    position: absolute;

    top: 0;

    bottom: 0;

    width: 33.333%;

    cursor: default;

    z-index: 2;
}

.rod-area:nth-child(1) {
    left: 0;
}

.rod-area:nth-child(2) {
    left: 33.333%;
}

.rod-area:nth-child(3) {
    left: 66.666%;
}

/* 柱子 */

.rod {
    position: absolute;

    width: 11px;

    height: 290px;

    left: 50%;

    bottom: 52px;

    transform: translateX(-50%);

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #6578ac,
            #d8e0ff,
            #6578ac
        );

    box-shadow:
        0 0 16px rgba(130,160,255,.22);

    transition:
        box-shadow .2s,
        filter .2s;
}

/* 柱子顶部 */

.rod::before {
    content: "";

    position: absolute;

    width: 30px;
    height: 9px;

    left: 50%;
    top: -3px;

    transform: translateX(-50%);

    border-radius: 8px;

    background:
        linear-gradient(
            90deg,
            #7184b8,
            #e0e7ff,
            #7184b8
        );
}

/* 目标柱高亮 */

.rod-area.drop-target .rod {
    box-shadow:
        0 0 28px rgba(80,220,255,.9);

    filter: brightness(1.3);
}

.rod-area.drop-target::after {
    content: "";

    position: absolute;

    left: 50%;

    bottom: 63px;

    width: 220px;

    height: 65px;

    transform: translateX(-50%);

    border-radius: 50%;

    border: 2px dashed rgba(85,220,255,.7);

    background: rgba(70,200,255,.06);

    pointer-events: none;
}

/* 柱子名称 */

.rod-label {
    position: absolute;

    left: 50%;

    bottom: 9px;

    transform: translateX(-50%);

    color: #aeb9d8;

    font-size: 16px;

    font-weight: bold;
}

.rod-hint {
    position: absolute;

    left: 50%;

    top: 14px;

    transform: translateX(-50%);

    color: #596682;

    font-size: 12px;

    white-space: nowrap;
}

/* =========================
   圆盘容器
========================= */

.disks {
    position: absolute;

    left: 50%;

    bottom: 61px;

    width: 220px;

    height: 280px;

    transform: translateX(-50%);

    display: flex;

    flex-direction: column-reverse;

    align-items: center;

    justify-content: flex-start;

    pointer-events: none;

    z-index: 10;
}

/* =========================
   圆盘
========================= */

.disk {
    position: relative;

    flex-shrink: 0;

    height: 34px;

    margin-top: 2px;

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 12px;

    font-weight: bold;

    color: rgba(255,255,255,.92);

    box-shadow:
        0 5px 10px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.28),
        inset 0 -1px rgba(0,0,0,.12);

    transition:
        transform .2s ease,
        filter .2s ease,
        box-shadow .2s ease;

    pointer-events: auto;

    cursor: grab;

    touch-action: none;

    will-change: transform, left, top;
}

/* 圆盘中间高光 */

.disk::before {
    content: "";

    position: absolute;

    left: 8%;

    right: 8%;

    top: 4px;

    height: 6px;

    border-radius: 10px;

    background: rgba(255,255,255,.14);

    pointer-events: none;
}

/* 圆盘颜色 */

.disk[data-size="1"] {
    background:
        linear-gradient(
            90deg,
            #ff4779,
            #ff7897
        );
}

.disk[data-size="2"] {
    background:
        linear-gradient(
            90deg,
            #ff8438,
            #ffb35d
        );
}

.disk[data-size="3"] {
    background:
        linear-gradient(
            90deg,
            #ffd039,
            #ffe878
        );

    color: #503d00;
}

.disk[data-size="4"] {
    background:
        linear-gradient(
            90deg,
            #39d995,
            #7af0ba
        );
}

.disk[data-size="5"] {
    background:
        linear-gradient(
            90deg,
            #31b9ff,
            #7ad9ff
        );
}

.disk[data-size="6"] {
    background:
        linear-gradient(
            90deg,
            #687cff,
            #9a8cff
        );
}

.disk[data-size="7"] {
    background:
        linear-gradient(
            90deg,
            #a85cff,
            #d092ff
        );
}

.disk[data-size="8"] {
    background:
        linear-gradient(
            90deg,
            #ed54ff,
            #ff8bd7
        );
}

/* 最上面的圆盘 */

.disk.top-disk {
    cursor: grab;

    box-shadow:
        0 6px 15px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.08);
}

.disk.top-disk:hover {
    filter: brightness(1.08);

    transform:
        translateY(-3px);
}

/* 被抓住 */

.disk.dragging {
    cursor: grabbing;

    filter: brightness(1.13);

    box-shadow:
        0 18px 30px rgba(0,0,0,.45),
        0 0 30px rgba(100,210,255,.32);

    z-index: 9999;
}

/* =========================
   拖拽中的浮动圆盘
========================= */

.drag-layer {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 1000;
}

/* =========================
   提示
========================= */

.message {
    min-height: 25px;

    margin-top: 14px;

    text-align: center;

    color: #93a0c4;

    font-size: 14px;

    transition: color .2s;
}

.message.good {
    color: #65e3ff;
}

.message.bad {
    color: #ff7998;
}

/* =========================
   胜利弹窗
========================= */

.win-overlay {
    position: fixed;

    inset: 0;

    z-index: 5000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(3,5,15,.78);

    backdrop-filter: blur(10px);
}

.win-overlay.show {
    display: flex;
}

.win {
    width: min(430px, 100%);

    padding: 35px;

    text-align: center;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #172143,
            #10162e
        );

    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 35px 100px rgba(0,0,0,.65);

    animation: winPop .35s ease;
}

@keyframes winPop {

    from {
        opacity: 0;
        transform: scale(.78) translateY(20px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }

}

.win-icon {
    font-size: 64px;
}

.win h2 {
    margin-top: 8px;

    font-size: 30px;
}

.win p {
    margin-top: 8px;

    color: #aab5d4;

    line-height: 1.7;
}

.win-score {
    margin: 20px 0;

    padding: 15px;

    border-radius: 15px;

    background: rgba(255,255,255,.05);

    color: #c6d0e8;

    line-height: 1.9;
}

/* =========================
   底部
========================= */

.footer {
    margin-top: 15px;

    text-align: center;

    color: #56627f;

    font-size: 12px;
}

/* =========================
   手机
========================= */

@media (max-width: 650px) {

    body {
        padding: 7px;
    }

    .game {
        padding: 13px;

        border-radius: 19px;
    }

    .header {
        margin-bottom: 13px;
    }

    .header h1 {
        font-size: 31px;
    }

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .board {
        height: 430px;
    }

    .rod {
        height: 270px;
    }

    .disks {
        bottom: 61px;

        width: 200px;
    }

    .disk {
        height: 30px;
    }

    .rod-area.drop-target::after {
        width: 150px;
    }

    .footer {
        display: none;
    }
}

/* 小屏横向 */

@media (max-height: 520px) and (orientation: landscape) {

    body {
        padding: 5px;
    }

    .game {
        padding: 10px;
    }

    .header {
        margin-bottom: 7px;
    }

    .header h1 {
        font-size: 25px;
    }

    .header p {
        display: none;
    }

    .controls {
        margin-bottom: 7px;
    }

    .stats {
        margin-bottom: 7px;
    }

    .board {
        height: 330px;
    }

    .rod {
        height: 220px;
    }

    .disks {
        height: 220px;
    }
}

</style>
</head>

<body>

<div class="game">

    <div class="header">
        <h1>汉诺塔</h1>
        <p>HANOI TOWER · DRAG & DROP</p>
    </div>

    <div class="controls">

        <div class="control-item">
            圆盘：

            <select id="diskCount">
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
        </div>

        <button id="restartBtn">
            🔄 重新开始
        </button>

        <button id="undoBtn">
            ↩️ 撤销
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-label">
                当前步数
            </div>

            <div class="stat-value"
                 id="moves">
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                最少步数
            </div>

            <div class="stat-value"
                 id="minimum">
                31
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                用时
            </div>

            <div class="stat-value"
                 id="time">
                00:00
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                圆盘数量
            </div>

            <div class="stat-value"
                 id="count">
                5
            </div>
        </div>

    </div>


    <!-- 游戏区域 -->

    <div class="board"
         id="board">

        <div class="floor"></div>


        <!-- A -->

        <div class="rod-area"
             data-rod="0">

            <div class="rod"></div>

            <div class="disks"
                 id="disks0"></div>

            <div class="rod-hint">
                拖动圆盘
            </div>

            <div class="rod-label">
                A
            </div>

        </div>


        <!-- B -->

        <div class="rod-area"
             data-rod="1">

            <div class="rod"></div>

            <div class="disks"
                 id="disks1"></div>

            <div class="rod-hint">
                放到这里
            </div>

            <div class="rod-label">
                B
            </div>

        </div>


        <!-- C -->

        <div class="rod-area"
             data-rod="2">

            <div class="rod"></div>

            <div class="disks"
                 id="disks2"></div>

            <div class="rod-hint">
                放到这里
            </div>

            <div class="rod-label">
                C
            </div>

        </div>


        <!-- 拖拽层 -->

        <div class="drag-layer"
             id="dragLayer">
        </div>

    </div>


    <div class="message"
         id="message">

        👆 按住最上面的圆盘，把它拖到另一根柱子

    </div>


    <div class="footer">

        大圆盘不能放在小圆盘上面 · 拖拽操作

    </div>

</div>


<!-- 胜利 -->

<div class="win-overlay"
     id="winOverlay">

    <div class="win">

        <div class="win-icon">
            🏆
        </div>

        <h2>
            挑战成功！
        </h2>

        <p>
            所有圆盘已经移动到 C 柱
        </p>

        <div class="win-score">

            <div>
                步数：
                <strong id="winMoves">
                    0
                </strong>
            </div>

            <div>
                最少：
                <strong id="winMinimum">
                    0
                </strong>
            </div>

            <div>
                用时：
                <strong id="winTime">
                    00:00
                </strong>
            </div>

        </div>

        <button id="winRestartBtn">
            🔄 再玩一次
        </button>

    </div>

</div>


<script>

/*
===========================================================
汉诺塔 · 拖拽版
===========================================================
*/

let diskCount = 5;

let towers = [
    [],
    [],
    []
];

let moves = 0;

let history = [];

let startTime = null;

let timer = null;

let gameFinished = false;


/*
===========================================================
拖拽状态
===========================================================
*/

let dragging = false;

let dragDisk = null;

let dragFrom = -1;

let dragPointerId = null;

let dragOffsetX = 0;

let dragOffsetY = 0;

let dragOriginalParent = null;

let dragOriginalNextSibling = null;

let dragOriginalTransform = "";

let currentTarget = -1;


/*
===========================================================
DOM
===========================================================
*/

const board =
    document.getElementById("board");

const message =
    document.getElementById("message");

const winOverlay =
    document.getElementById("winOverlay");


/*
===========================================================
初始化
===========================================================
*/

function initGame() {

    diskCount =
        parseInt(
            document.getElementById(
                "diskCount"
            ).value
        );

    towers = [
        [],
        [],
        []
    ];

    /*
     * 最大圆盘在最下面
     *
     * 数组最后一个
     * 是最上面的圆盘
     */

    for (
        let i = diskCount;
        i >= 1;
        i--
    ) {

        towers[0].push(i);

    }

    moves = 0;

    history = [];

    startTime = null;

    gameFinished = false;

    clearInterval(timer);

    dragging = false;

    dragDisk = null;

    dragFrom = -1;

    currentTarget = -1;

    document.getElementById("moves")
        .textContent = "0";

    document.getElementById("count")
        .textContent = diskCount;

    document.getElementById("minimum")
        .textContent =
        Math.pow(2, diskCount) - 1;

    document.getElementById("time")
        .textContent = "00:00";

    winOverlay.classList.remove("show");

    showMessage(
        "👆 按住最上面的圆盘，把它拖到另一根柱子"
    );

    render();

}


/*
===========================================================
计算圆盘宽度
===========================================================
*/

function getDiskWidth(size) {

    const min = 55;

    const max = 195;

    if (diskCount === 1) {
        return max;
    }

    return min +
        (size - 1) /
        (diskCount - 1) *
        (max - min);

}


/*
===========================================================
绘制圆盘
===========================================================
*/

function render() {

    for (let i = 0; i < 3; i++) {

        const container =
            document.getElementById(
                "disks" + i
            );

        container.innerHTML = "";


        towers[i].forEach(
            (size, index) => {

                const disk =
                    document.createElement(
                        "div"
                    );

                disk.className = "disk";

                disk.dataset.size =
                    size;

                disk.dataset.rod =
                    i;

                disk.textContent =
                    size;

                disk.style.width =
                    getDiskWidth(size)
                    + "px";


                /*
                 * 最上面的圆盘
                 * 才能拖
                 */

                if (
                    index ===
                    towers[i].length - 1
                ) {

                    disk.classList.add(
                        "top-disk"
                    );

                    addDragEvents(disk);

                }


                container.appendChild(
                    disk
                );

            }
        );

    }

}


/*
===========================================================
添加拖拽事件
===========================================================
*/

function addDragEvents(disk) {

    disk.addEventListener(
        "pointerdown",
        startDrag
    );

}


/*
===========================================================
开始拖拽
===========================================================
*/

function startDrag(e) {

    if (gameFinished) {
        return;
    }

    if (dragging) {
        return;
    }


    const disk =
        e.currentTarget;

    const from =
        parseInt(
            disk.dataset.rod
        );

    /*
     * 安全检查：
     * 必须是最上面的圆盘
     */

    const top =
        towers[from][
            towers[from].length - 1
        ];

    const size =
        parseInt(
            disk.dataset.size
        );

    if (top !== size) {

        return;

    }


    /*
     * 开始计时
     */

    if (moves === 0 && !startTime) {

        startTimer();

    }


    dragging = true;

    dragDisk = disk;

    dragFrom = from;

    dragPointerId =
        e.pointerId;


    /*
     * 记录原来的位置
     */

    const rect =
        disk.getBoundingClientRect();

    const boardRect =
        board.getBoundingClientRect();


    dragOffsetX =
        e.clientX -
        rect.left -
        rect.width / 2;

    dragOffsetY =
        e.clientY -
        rect.top -
        rect.height / 2;


    /*
     * 把圆盘从原容器拿出来
     * 放进绝对定位拖拽层
     */

    dragOriginalParent =
        disk.parentElement;

    dragOriginalNextSibling =
        disk.nextSibling;

    dragOriginalTransform =
        disk.style.transform;


    board
        .setPointerCapture(
            e.pointerId
        );


    const x =
        e.clientX -
        boardRect.left -
        rect.width / 2;

    const y =
        e.clientY -
        boardRect.top -
        rect.height / 2;


    /*
     * 从 DOM 中拿出来
     */

    disk.remove();

    document
        .getElementById("dragLayer")
        .appendChild(disk);


    disk.classList.add(
        "dragging"
    );


    disk.style.position =
        "absolute";

    disk.style.left =
        x + "px";

    disk.style.top =
        y + "px";

    disk.style.margin =
        "0";

    disk.style.transform =
        "scale(1.05)";


    /*
     * 原来的塔暂时减少一个圆盘
     */

    towers[from].pop();

    render();


    showMessage(
        "✋ 正在拖动圆盘 " +
        size +
        "，移动到目标柱后松手",
        "good"
    );


    updateDropTarget(
        e.clientX,
        e.clientY
    );

}


/*
===========================================================
拖拽移动
===========================================================
*/

function moveDrag(e) {

    if (
        !dragging ||
        e.pointerId !== dragPointerId
    ) {
        return;
    }


    const boardRect =
        board.getBoundingClientRect();

    const diskRect =
        dragDisk.getBoundingClientRect();


    let x =
        e.clientX -
        boardRect.left -
        diskRect.width / 2;

    let y =
        e.clientY -
        boardRect.top -
        diskRect.height / 2;


    /*
     * 限制不要拖出游戏区域
     */

    x = Math.max(
        0,
        Math.min(
            board.clientWidth -
            diskRect.width,
            x
        )
    );

    y = Math.max(
        0,
        Math.min(
            board.clientHeight -
            diskRect.height,
            y
        )
    );


    dragDisk.style.left =
        x + "px";

    dragDisk.style.top =
        y + "px";


    updateDropTarget(
        e.clientX,
        e.clientY
    );

}


/*
===========================================================
判断当前鼠标/手指在哪个柱子
===========================================================
*/

function getTargetRod(clientX, clientY) {

    const areas =
        document.querySelectorAll(
            ".rod-area"
        );


    for (
        let i = 0;
        i < areas.length;
        i++
    ) {

        const rect =
            areas[i]
                .getBoundingClientRect();


        /*
         * 扩大可放置区域
         * 拖过去比较容易
         */

        const extraX = 45;

        if (
            clientX >=
                rect.left - extraX &&
            clientX <=
                rect.right + extraX &&
            clientY >=
                rect.top &&
            clientY <=
                rect.bottom
        ) {

            return i;

        }

    }


    return -1;

}


/*
===========================================================
更新目标柱高亮
===========================================================
*/

function updateDropTarget(
    clientX,
    clientY
) {

    const target =
        getTargetRod(
            clientX,
            clientY
        );


    clearDropTargets();


    if (
        target === -1 ||
        target === dragFrom
    ) {

        currentTarget = -1;

        return;

    }


    const size =
        parseInt(
            dragDisk.dataset.size
        );


    const targetTop =
        towers[target][
            towers[target].length - 1
        ];


    /*
     * 判断是否合法
     */

    if (
        targetTop === undefined ||
        size < targetTop
    ) {

        currentTarget =
            target;

        document
            .querySelector(
                `.rod-area[data-rod="${target}"]`
            )
            .classList.add(
                "drop-target"
            );

    } else {

        currentTarget = -1;

        showMessage(
            "❌ 这个圆盘太大，不能放在上面",
            "bad"
        );

    }

}


/*
===========================================================
清除目标效果
===========================================================
*/

function clearDropTargets() {

    document
        .querySelectorAll(
            ".rod-area"
        )
        .forEach(
            el =>
                el.classList.remove(
                    "drop-target"
                )
        );

}


/*
===========================================================
松手
===========================================================
*/

function endDrag(e) {

    if (
        !dragging ||
        e.pointerId !== dragPointerId
    ) {

        return;

    }


    const target =
        currentTarget;


    clearDropTargets();


    /*
     * 合法移动
     */

    if (
        target !== -1 &&
        target !== dragFrom
    ) {

        completeDrag(
            target
        );

    } else {

        /*
         * 非法：
         * 回到原来的柱子
         */

        cancelDrag();

    }


    dragging = false;

    dragPointerId = null;

}


/*
===========================================================
完成拖拽
===========================================================
*/

function completeDrag(target) {

    const size =
        parseInt(
            dragDisk.dataset.size
        );


    /*
     * 保存历史
     */

    history.push(
        JSON.stringify(
            towers
        )
    );


    /*
     * 圆盘加入目标柱
     */

    towers[target].push(
        size
    );

    moves++;


    document.getElementById("moves")
        .textContent = moves;


    /*
     * 删除拖拽对象
     */

    dragDisk.remove();

    dragDisk = null;


    render();


    /*
     * 播放轻微落下提示
     */

    showMessage(
        "✓ 圆盘 " +
        size +
        " 已放到 " +
        ["A","B","C"][target] +
        " 柱",
        "good"
    );


    /*
     * 检查胜利
     */

    if (
        towers[2].length ===
        diskCount
    ) {

        finishGame();

    }

}


/*
===========================================================
取消拖拽
===========================================================
*/

function cancelDrag() {

    const size =
        parseInt(
            dragDisk.dataset.size
        );


    /*
     * 把圆盘放回原柱
     */

    towers[dragFrom].push(
        size
    );


    dragDisk.remove();

    dragDisk = null;


    render();


    showMessage(
        "↩️ 已放回原来的位置",
        "bad"
    );

}


/*
===========================================================
鼠标/手指移动
===========================================================
*/

board.addEventListener(
    "pointermove",
    moveDrag
);


/*
===========================================================
鼠标/手指松开
===========================================================
*/

board.addEventListener(
    "pointerup",
    endDrag
);

board.addEventListener(
    "pointercancel",
    endDrag
);


/*
===========================================================
防止拖动时浏览器滚动
===========================================================
*/

board.addEventListener(
    "pointerdown",
    e => {

        if (
            e.target.classList.contains(
                "disk"
            )
        ) {

            e.preventDefault();

        }

    },
    {
        passive: false
    }
);


/*
===========================================================
提示
===========================================================
*/

function showMessage(
    text,
    type = ""
) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/*
===========================================================
计时器
===========================================================
*/

function startTimer() {

    startTime =
        Date.now();

    clearInterval(timer);


    timer =
        setInterval(
            () => {

                if (!startTime) {
                    return;
                }


                const seconds =
                    Math.floor(
                        (
                            Date.now() -
                            startTime
                        ) / 1000
                    );


                updateTime(
                    seconds
                );

            },
            1000
        );

}


function updateTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );

    const sec =
        seconds % 60;


    document.getElementById(
        "time"
    ).textContent =
        String(minutes)
            .padStart(2,"0") +
        ":" +
        String(sec)
            .padStart(2,"0");

}


/*
===========================================================
撤销
===========================================================
*/

function undoMove() {

    if (dragging) {
        return;
    }


    if (
        history.length === 0
    ) {

        showMessage(
            "目前没有可以撤销的操作"
        );

        return;

    }


    towers =
        JSON.parse(
            history.pop()
        );


    moves--;

    if (moves < 0) {
        moves = 0;
    }


    document.getElementById(
        "moves"
    ).textContent = moves;


    if (moves === 0) {

        clearInterval(timer);

        startTime = null;

        document.getElementById(
            "time"
        ).textContent =
            "00:00";

    }


    render();


    showMessage(
        "↩️ 已撤销一步"
    );

}


/*
===========================================================
完成游戏
===========================================================
*/

function finishGame() {

    gameFinished = true;

    clearInterval(timer);


    const finalTime =
        document.getElementById(
            "time"
        ).textContent;


    document.getElementById(
        "winMoves"
    ).textContent =
        moves;


    document.getElementById(
        "winMinimum"
    ).textContent =
        Math.pow(
            2,
            diskCount
        ) - 1;


    document.getElementById(
        "winTime"
    ).textContent =
        finalTime;


    setTimeout(
        () => {

            winOverlay
                .classList
                .add("show");

        },
        250
    );

}


/*
===========================================================
重新开始
===========================================================
*/

function restartGame() {

    initGame();

}


/*
===========================================================
按钮
===========================================================
*/

document
    .getElementById(
        "restartBtn"
    )
    .addEventListener(
        "click",
        restartGame
    );


document
    .getElementById(
        "undoBtn"
    )
    .addEventListener(
        "click",
        undoMove
    );


document
    .getElementById(
        "winRestartBtn"
    )
    .addEventListener(
        "click",
        restartGame
    );


document
    .getElementById(
        "diskCount"
    )
    .addEventListener(
        "change",
        restartGame
    );


/*
===========================================================
启动
===========================================================
*/

initGame();

</script>

</body>
</html>

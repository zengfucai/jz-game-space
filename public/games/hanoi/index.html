<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>JZ · 汉诺塔</title>

<style>

/* =========================================================
   基础
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 15%,
            #263b72 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 85%,
            #342066 0%,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #070a17,
            #10162d 50%,
            #080a16
        );

    color: white;

    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;
}

button,
select {
    font-family: inherit;
}

/* =========================================================
   整个游戏
========================================================= */

.game {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    padding: 20px;

    gap: 14px;
}

/* =========================================================
   PC 标题
========================================================= */

.header {
    flex-shrink: 0;

    text-align: center;
}

.header h1 {
    font-size: 44px;

    line-height: 1.05;

    letter-spacing: 6px;

    background:
        linear-gradient(
            90deg,
            #63e7ff,
            #9b7bff,
            #ff72c8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.header p {
    margin-top: 7px;

    color: #7885a7;

    font-size: 12px;

    letter-spacing: 3px;
}

/* =========================================================
   PC 控制栏
========================================================= */

.pc-controls {
    flex-shrink: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    flex-wrap: wrap;
}

.control-box {
    display: flex;

    align-items: center;

    gap: 7px;

    padding: 9px 13px;

    border-radius: 11px;

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,255,255,.08);

    color: #c5cee5;

    font-size: 13px;
}

select {
    padding: 5px 9px;

    color: white;

    background: #171e38;

    border: 1px solid #3d496c;

    border-radius: 7px;

    outline: none;
}

button {
    border: 0;

    padding: 10px 16px;

    border-radius: 10px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #506aff,
            #8058ff
        );

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .15s,
        filter .15s;
}

button:hover {
    transform: translateY(-2px);

    filter: brightness(1.12);
}

button:active {
    transform: scale(.96);
}

/* =========================================================
   PC 数据
========================================================= */

.pc-stats {
    flex-shrink: 0;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    width: min(800px, 100%);

    margin: 0 auto;
}

.stat {
    padding: 9px;

    text-align: center;

    border-radius: 12px;

    background: rgba(0,0,0,.18);

    border: 1px solid rgba(255,255,255,.055);
}

.stat-label {
    font-size: 10px;

    color: #7783a5;
}

.stat-value {
    margin-top: 3px;

    font-size: 19px;

    font-weight: bold;
}

/* =========================================================
   游戏棋盘
========================================================= */

.board {
    position: relative;

    flex: 1;

    min-height: 0;

    overflow: hidden;

    border-radius: 22px;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(120,150,255,.075),
            transparent 55%
        ),
        linear-gradient(
            180deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.008)
        );

    border: 1px solid rgba(255,255,255,.075);

    touch-action: none;
}

/* =========================================================
   地面
========================================================= */

.floor {
    position: absolute;

    left: 6%;
    right: 6%;

    bottom: 48px;

    height: 8px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #394a72,
            #8b9bc9,
            #394a72
        );

    box-shadow:
        0 0 18px rgba(120,150,255,.25);

    z-index: 1;
}

/* =========================================================
   柱子区域
========================================================= */

.rod-area {
    position: absolute;

    top: 0;
    bottom: 0;

    width: 33.333333%;

    z-index: 2;

    pointer-events: none;
}

.rod-area[data-rod="0"] {
    left: 0;
}

.rod-area[data-rod="1"] {
    left: 33.333333%;
}

.rod-area[data-rod="2"] {
    left: 66.666666%;
}

/* =========================================================
   柱子
========================================================= */

.rod {
    position: absolute;

    left: 50%;

    bottom: 54px;

    width: 10px;

    height: 62%;

    min-height: 180px;
    max-height: 330px;

    transform:
        translateX(-50%);

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #6578ac,
            #dce4ff,
            #6578ac
        );

    box-shadow:
        0 0 16px rgba(130,160,255,.22);

    transition:
        box-shadow .2s,
        filter .2s;
}

.rod::before {
    content: "";

    position: absolute;

    left: 50%;
    top: -4px;

    width: 32px;
    height: 9px;

    transform:
        translateX(-50%);

    border-radius: 8px;

    background:
        linear-gradient(
            90deg,
            #7184b8,
            #e0e7ff,
            #7184b8
        );
}

/* =========================================================
   目标柱
========================================================= */

.rod-area.drop-target .rod {
    box-shadow:
        0 0 30px rgba(80,220,255,.95);

    filter: brightness(1.3);
}

.rod-area.drop-target::after {
    content: "";

    position: absolute;

    left: 50%;

    bottom: 61px;

    width: min(230px, 85%);

    height: 64px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    border: 2px dashed
        rgba(85,220,255,.7);

    background:
        rgba(70,200,255,.055);
}

/* =========================================================
   A B C
========================================================= */

.rod-label {
    position: absolute;

    left: 50%;

    bottom: 10px;

    transform:
        translateX(-50%);

    font-size: 16px;

    font-weight: bold;

    color: #aeb9d8;
}

.rod-hint {
    position: absolute;

    left: 50%;

    top: 15px;

    transform:
        translateX(-50%);

    font-size: 11px;

    color: #56627f;

    white-space: nowrap;
}

/* =========================================================
   圆盘容器
========================================================= */

.disks {
    position: absolute;

    left: 50%;

    bottom: 62px;

    width: min(230px, 92%);

    height: 62%;

    transform:
        translateX(-50%);

    display: flex;

    flex-direction: column-reverse;

    align-items: center;

    justify-content: flex-start;

    pointer-events: none;

    z-index: 10;
}

/* =========================================================
   圆盘
========================================================= */

.disk {
    position: relative;

    flex-shrink: 0;

    height: 34px;

    margin-top: 2px;

    border-radius: 9px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 12px;

    font-weight: bold;

    color: rgba(255,255,255,.95);

    box-shadow:
        0 5px 10px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.28);

    pointer-events: auto;

    cursor: grab;

    touch-action: none;

    will-change:
        transform,
        left,
        top;

    transition:
        filter .18s,
        box-shadow .18s;
}

.disk::before {
    content: "";

    position: absolute;

    left: 8%;
    right: 8%;

    top: 4px;

    height: 6px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.15);

    pointer-events: none;
}

/* =========================================================
   圆盘颜色
========================================================= */

.disk[data-size="1"] {
    background:
        linear-gradient(
            90deg,
            #ff4779,
            #ff7897
        );
}

.disk[data-size="2"] {
    background:
        linear-gradient(
            90deg,
            #ff8438,
            #ffb35d
        );
}

.disk[data-size="3"] {
    background:
        linear-gradient(
            90deg,
            #ffd039,
            #ffe878
        );

    color: #503d00;
}

.disk[data-size="4"] {
    background:
        linear-gradient(
            90deg,
            #39d995,
            #7af0ba
        );
}

.disk[data-size="5"] {
    background:
        linear-gradient(
            90deg,
            #31b9ff,
            #7ad9ff
        );
}

.disk[data-size="6"] {
    background:
        linear-gradient(
            90deg,
            #687cff,
            #9a8cff
        );
}

.disk[data-size="7"] {
    background:
        linear-gradient(
            90deg,
            #a85cff,
            #d092ff
        );
}

.disk[data-size="8"] {
    background:
        linear-gradient(
            90deg,
            #ed54ff,
            #ff8bd7
        );
}

/* =========================================================
   可拖圆盘
========================================================= */

.disk.top-disk {
    cursor: grab;
}

.disk.top-disk:hover {
    filter: brightness(1.08);

    transform:
        translateY(-3px);
}

/* =========================================================
   被抓住
========================================================= */

.disk.dragging {
    cursor: grabbing;

    filter: brightness(1.15);

    box-shadow:
        0 20px 35px rgba(0,0,0,.48),
        0 0 30px
        rgba(100,210,255,.35);

    z-index: 9999;

    transform:
        scale(1.07)
        rotate(1deg);
}

/* =========================================================
   拖拽层
========================================================= */

.drag-layer {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 1000;
}

/* =========================================================
   提示
========================================================= */

.message {
    flex-shrink: 0;

    min-height: 20px;

    text-align: center;

    color: #8290b3;

    font-size: 13px;
}

.message.good {
    color: #65e3ff;
}

.message.bad {
    color: #ff7998;
}

/* =========================================================
   手机底部控制栏
========================================================= */

.mobile-controls {
    display: none;
}

/* =========================================================
   手机顶部状态
========================================================= */

.mobile-top {
    display: none;
}

/* =========================================================
   胜利
========================================================= */

.win-overlay {
    position: fixed;

    inset: 0;

    z-index: 5000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(3,5,15,.8);

    backdrop-filter:
        blur(10px);
}

.win-overlay.show {
    display: flex;
}

.win {
    width: min(430px, 100%);

    padding: 32px;

    text-align: center;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            #172143,
            #10162e
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.65);

    animation:
        winPop .35s ease;
}

@keyframes winPop {

    from {
        opacity: 0;

        transform:
            scale(.8)
            translateY(20px);
    }

    to {
        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }

}

.win-icon {
    font-size: 60px;
}

.win h2 {
    margin-top: 7px;

    font-size: 29px;
}

.win p {
    margin-top: 7px;

    color: #aab5d4;

    font-size: 13px;
}

.win-score {
    margin: 18px 0;

    padding: 14px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.05);

    line-height: 1.9;

    color: #c6d0e8;
}


/* =========================================================
   =========================================================
   手机竖屏
   =========================================================
   ========================================================= */

@media (max-width: 700px) and (orientation: portrait) {

    body {
        background:
            radial-gradient(
                circle at 20% 10%,
                #1d2d5b,
                transparent 40%
            ),
            linear-gradient(
                160deg,
                #070a17,
                #10162d
            );
    }

    .game {
        padding:
            max(8px, env(safe-area-inset-top))
            8px
            max(8px, env(safe-area-inset-bottom))
            8px;

        gap: 6px;
    }

    /* -----------------------------------------
       手机标题：非常小
    ----------------------------------------- */

    .header {
        height: 34px;

        display: flex;

        justify-content: center;
        align-items: center;
    }

    .header h1 {
        font-size: 24px;

        letter-spacing: 4px;
    }

    .header p {
        display: none;
    }

    /* -----------------------------------------
       隐藏 PC 控件
    ----------------------------------------- */

    .pc-controls,
    .pc-stats,
    .message,
    .footer {
        display: none;
    }

    /* -----------------------------------------
       手机顶部状态
    ----------------------------------------- */

    .mobile-top {
        display: flex;

        flex-shrink: 0;

        height: 35px;

        align-items: center;

        justify-content: center;

        gap: 8px;
    }

    .mobile-stat {
        min-width: 74px;

        padding: 6px 9px;

        border-radius: 9px;

        background:
            rgba(0,0,0,.22);

        border:
            1px solid
            rgba(255,255,255,.07);

        text-align: center;

        font-size: 11px;

        color: #a9b4d0;
    }

    .mobile-stat strong {
        margin-left: 3px;

        color: white;

        font-size: 13px;
    }

    /* -----------------------------------------
       游戏区
       核心！
       占手机绝大多数空间
    ----------------------------------------- */

    .board {
        flex: 1;

        min-height: 0;

        width: 100%;

        border-radius: 17px;
    }

    .floor {
        left: 4%;
        right: 4%;

        bottom: 36px;

        height: 7px;
    }

    /* -----------------------------------------
       手机柱子
    ----------------------------------------- */

    .rod {
        bottom: 41px;

        width: 8px;

        height: 68%;

        min-height: 180px;

        max-height: none;
    }

    .rod::before {
        width: 27px;

        height: 8px;
    }

    /* -----------------------------------------
       手机圆盘
       加大高度，方便手指抓
    ----------------------------------------- */

    .disks {
        bottom: 48px;

        height: 68%;

        width: 94%;
    }

    .disk {
        height: 31px;

        margin-top: 2px;

        border-radius: 8px;

        font-size: 10px;
    }

    /* -----------------------------------------
       柱子名字
    ----------------------------------------- */

    .rod-label {
        bottom: 7px;

        font-size: 14px;
    }

    .rod-hint {
        display: none;
    }

    /* -----------------------------------------
       手机底部控制
    ----------------------------------------- */

    .mobile-controls {
        display: flex;

        flex-shrink: 0;

        height: 48px;

        align-items: center;

        justify-content: center;

        gap: 7px;
    }

    .mobile-count {
        height: 42px;

        padding: 0 10px;

        display: flex;

        align-items: center;

        gap: 5px;

        border-radius: 10px;

        background:
            rgba(255,255,255,.065);

        border:
            1px solid
            rgba(255,255,255,.08);

        color: #b8c2db;

        font-size: 11px;
    }

    .mobile-count select {
        padding: 4px 5px;

        font-size: 12px;
    }

    .mobile-controls button {
        width: 43px;

        height: 42px;

        padding: 0;

        font-size: 18px;

        border-radius: 10px;
    }

    /* -----------------------------------------
       手机胜利弹窗
    ----------------------------------------- */

    .win {
        padding: 26px 20px;

        border-radius: 20px;
    }

    .win-icon {
        font-size: 52px;
    }

    .win h2 {
        font-size: 25px;
    }

}


/* =========================================================
   =========================================================
   手机横屏
   =========================================================
   ========================================================= */

@media (max-width: 900px)
       and (orientation: landscape) {

    body {
        background:
            linear-gradient(
                135deg,
                #070a17,
                #10162d
            );
    }

    .game {

        padding:
            max(5px, env(safe-area-inset-top))
            max(7px, env(safe-area-inset-right))
            max(5px, env(safe-area-inset-bottom))
            max(7px, env(safe-area-inset-left));

        gap: 4px;

    }

    /* -----------------------------------------
       横屏标题
    ----------------------------------------- */

    .header {
        height: 26px;
    }

    .header h1 {
        font-size: 20px;

        letter-spacing: 4px;
    }

    .header p {
        display: none;
    }

    /* -----------------------------------------
       隐藏 PC
    ----------------------------------------- */

    .pc-controls,
    .pc-stats,
    .message,
    .footer {
        display: none;
    }

    /* -----------------------------------------
       顶部数据
    ----------------------------------------- */

    .mobile-top {
        display: flex;

        position: absolute;

        top: 5px;

        left: 50%;

        transform:
            translateX(-50%);

        z-index: 30;

        gap: 5px;
    }

    .mobile-stat {
        padding: 3px 7px;

        border-radius: 7px;

        background:
            rgba(0,0,0,.35);

        font-size: 9px;

        color: #aab4ce;
    }

    .mobile-stat strong {
        color: white;

        font-size: 10px;
    }

    /* -----------------------------------------
       横屏游戏区
       几乎占满
    ----------------------------------------- */

    .board {
        flex: 1;

        min-height: 0;

        border-radius: 14px;
    }

    .floor {
        bottom: 27px;

        height: 6px;

        left: 4%;
        right: 4%;
    }

    /* -----------------------------------------
       柱子
    ----------------------------------------- */

    .rod {
        bottom: 32px;

        height: 72%;

        min-height: 130px;

        width: 7px;
    }

    .rod::before {
        width: 24px;

        height: 7px;
    }

    /* -----------------------------------------
       圆盘
    ----------------------------------------- */

    .disks {
        bottom: 38px;

        height: 72%;

        width: 92%;
    }

    .disk {
        height: 25px;

        margin-top: 1px;

        border-radius: 7px;

        font-size: 9px;
    }

    /* -----------------------------------------
       A B C
    ----------------------------------------- */

    .rod-label {
        bottom: 4px;

        font-size: 12px;
    }

    .rod-hint {
        display: none;
    }

    /* -----------------------------------------
       底部控制
    ----------------------------------------- */

    .mobile-controls {
        display: flex;

        position: absolute;

        right: 7px;

        bottom: 7px;

        z-index: 40;

        gap: 5px;
    }

    .mobile-count {
        height: 31px;

        padding: 0 7px;

        display: flex;

        align-items: center;

        gap: 3px;

        border-radius: 8px;

        background:
            rgba(0,0,0,.45);

        border:
            1px solid
            rgba(255,255,255,.08);

        color: #aab5d0;

        font-size: 9px;
    }

    .mobile-count select {
        padding: 2px 3px;

        font-size: 10px;
    }

    .mobile-controls button {
        width: 32px;

        height: 31px;

        padding: 0;

        border-radius: 8px;

        font-size: 14px;
    }

}


/* =========================================================
   很矮的手机横屏
========================================================= */

@media (max-height: 400px)
       and (orientation: landscape) {

    .header {
        display: none;
    }

    .game {
        padding: 3px;
    }

    .board {
        border-radius: 10px;
    }

    .rod {
        bottom: 25px;

        height: 76%;

        min-height: 100px;
    }

    .disks {
        bottom: 31px;

        height: 76%;
    }

    .floor {
        bottom: 21px;
    }

    .rod-label {
        bottom: 2px;
    }

    .mobile-controls {
        right: 4px;
        bottom: 4px;
    }

}

</style>

</head>


<body>


<div class="game">


    <!-- =====================================================
         标题
    ====================================================== -->

    <div class="header">

        <h1>汉诺塔</h1>

        <p>
            HANOI TOWER · DRAG & DROP
        </p>

    </div>


    <!-- =====================================================
         PC 控制
    ====================================================== -->

    <div class="pc-controls">

        <div class="control-box">

            圆盘

            <select id="diskCount">

                <option value="3">
                    3
                </option>

                <option value="4">
                    4
                </option>

                <option value="5" selected>
                    5
                </option>

                <option value="6">
                    6
                </option>

                <option value="7">
                    7
                </option>

                <option value="8">
                    8
                </option>

            </select>

        </div>


        <button id="restartBtn">
            🔄 重新开始
        </button>


        <button id="undoBtn">
            ↩️ 撤销
        </button>

    </div>


    <!-- =====================================================
         PC 数据
    ====================================================== -->

    <div class="pc-stats">

        <div class="stat">

            <div class="stat-label">
                当前步数
            </div>

            <div
                class="stat-value"
                id="moves">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                最少步数
            </div>

            <div
                class="stat-value"
                id="minimum">
                31
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                用时
            </div>

            <div
                class="stat-value"
                id="time">
                00:00
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                圆盘数量
            </div>

            <div
                class="stat-value"
                id="count">
                5
            </div>

        </div>

    </div>


    <!-- =====================================================
         手机顶部状态
    ====================================================== -->

    <div class="mobile-top">

        <div class="mobile-stat">

            步数

            <strong id="mobileMoves">
                0
            </strong>

        </div>


        <div class="mobile-stat">

            ⏱

            <strong id="mobileTime">
                00:00
            </strong>

        </div>

    </div>


    <!-- =====================================================
         游戏区
    ====================================================== -->

    <div
        class="board"
        id="board">


        <div class="floor"></div>


        <!-- A -->

        <div
            class="rod-area"
            data-rod="0">

            <div class="rod"></div>

            <div
                class="disks"
                id="disks0">
            </div>

            <div class="rod-hint">
                拖动
            </div>

            <div class="rod-label">
                A
            </div>

        </div>


        <!-- B -->

        <div
            class="rod-area"
            data-rod="1">

            <div class="rod"></div>

            <div
                class="disks"
                id="disks1">
            </div>

            <div class="rod-hint">
                放这里
            </div>

            <div class="rod-label">
                B
            </div>

        </div>


        <!-- C -->

        <div
            class="rod-area"
            data-rod="2">

            <div class="rod"></div>

            <div
                class="disks"
                id="disks2">
            </div>

            <div class="rod-hint">
                放这里
            </div>

            <div class="rod-label">
                C
            </div>

        </div>


        <!-- 拖拽层 -->

        <div
            class="drag-layer"
            id="dragLayer">
        </div>

    </div>


    <!-- =====================================================
         手机底部控制
    ====================================================== -->

    <div class="mobile-controls">

        <div class="mobile-count">

            盘

            <select id="mobileDiskCount">

                <option value="3">
                    3
                </option>

                <option value="4">
                    4
                </option>

                <option value="5" selected>
                    5
                </option>

                <option value="6">
                    6
                </option>

                <option value="7">
                    7
                </option>

                <option value="8">
                    8
                </option>

            </select>

        </div>


        <button
            id="mobileUndoBtn"
            title="撤销">
            ↩
        </button>


        <button
            id="mobileRestartBtn"
            title="重新开始">
            ↻
        </button>

    </div>


    <!-- PC 提示 -->

    <div
        class="message"
        id="message">

        👆 按住最上面的圆盘，把它拖到另一根柱子

    </div>


</div>


<!-- =========================================================
     胜利弹窗
========================================================= -->

<div
    class="win-overlay"
    id="winOverlay">


    <div class="win">

        <div class="win-icon">
            🏆
        </div>


        <h2>
            挑战成功！
        </h2>


        <p>
            所有圆盘已经移动到 C 柱
        </p>


        <div class="win-score">

            <div>
                步数：
                <strong id="winMoves">
                    0
                </strong>
            </div>

            <div>
                最少：
                <strong id="winMinimum">
                    0
                </strong>
            </div>

            <div>
                用时：
                <strong id="winTime">
                    00:00
                </strong>
            </div>

        </div>


        <button id="winRestartBtn">
            🔄 再玩一次
        </button>

    </div>

</div>


<script>

/* =========================================================
   汉诺塔核心
========================================================= */

let diskCount = 5;

let towers = [
    [],
    [],
    []
];

let moves = 0;

let history = [];

let startTime = null;

let timer = null;

let gameFinished = false;


/* =========================================================
   拖拽状态
========================================================= */

let dragging = false;

let dragDisk = null;

let dragFrom = -1;

let dragPointerId = null;

let currentTarget = -1;


/* =========================================================
   DOM
========================================================= */

const board =
    document.getElementById("board");

const message =
    document.getElementById("message");

const winOverlay =
    document.getElementById("winOverlay");


/* =========================================================
   初始化
========================================================= */

function initGame() {

    diskCount =
        parseInt(
            document.getElementById(
                "diskCount"
            ).value
        );


    towers = [
        [],
        [],
        []
    ];


    /*
     * 最大盘在下面
     */

    for (
        let i = diskCount;
        i >= 1;
        i--
    ) {

        towers[0].push(i);

    }


    moves = 0;

    history = [];

    startTime = null;

    clearInterval(timer);

    timer = null;

    gameFinished = false;

    dragging = false;

    dragDisk = null;

    dragFrom = -1;

    dragPointerId = null;

    currentTarget = -1;


    document.getElementById(
        "moves"
    ).textContent = "0";


    document.getElementById(
        "mobileMoves"
    ).textContent = "0";


    document.getElementById(
        "count"
    ).textContent =
        diskCount;


    document.getElementById(
        "minimum"
    ).textContent =
        Math.pow(
            2,
            diskCount
        ) - 1;


    document.getElementById(
        "time"
    ).textContent =
        "00:00";


    document.getElementById(
        "mobileTime"
    ).textContent =
        "00:00";


    document.getElementById(
        "diskCount"
    ).value =
        diskCount;


    document.getElementById(
        "mobileDiskCount"
    ).value =
        diskCount;


    winOverlay.classList.remove(
        "show"
    );


    clearDropTargets();


    showMessage(
        "👆 按住最上面的圆盘，把它拖到另一根柱子"
    );


    render();

}


/* =========================================================
   圆盘宽度
========================================================= */

function getDiskWidth(size) {

    /*
     * 手机和 PC 使用不同宽度
     */

    const mobile =
        window.innerWidth <= 700;


    if (mobile) {

        const min =
            window.innerWidth < 400
                ? 58
                : 64;

        const max =
            window.innerWidth < 400
                ? 155
                : 180;


        if (diskCount === 1) {
            return max;
        }


        return min +
            (size - 1) /
            (diskCount - 1) *
            (max - min);

    }


    const min = 60;

    const max = 205;


    if (diskCount === 1) {
        return max;
    }


    return min +
        (size - 1) /
        (diskCount - 1) *
        (max - min);

}


/* =========================================================
   绘制
========================================================= */

function render() {

    for (
        let rod = 0;
        rod < 3;
        rod++
    ) {

        const container =
            document.getElementById(
                "disks" + rod
            );


        container.innerHTML = "";


        towers[rod].forEach(
            (size, index) => {

                const disk =
                    document.createElement(
                        "div"
                    );


                disk.className =
                    "disk";


                disk.dataset.size =
                    size;


                disk.dataset.rod =
                    rod;


                disk.textContent =
                    size;


                disk.style.width =
                    getDiskWidth(size)
                    + "px";


                /*
                 * 只有最上面的可以拖
                 */

                if (
                    index ===
                    towers[rod].length - 1
                ) {

                    disk.classList.add(
                        "top-disk"
                    );


                    addDragEvents(
                        disk
                    );

                }


                container.appendChild(
                    disk
                );

            }
        );

    }

}


/* =========================================================
   拖拽事件
========================================================= */

function addDragEvents(disk) {

    disk.addEventListener(
        "pointerdown",
        startDrag
    );

}


/* =========================================================
   开始拖
========================================================= */

function startDrag(e) {

    if (gameFinished) {
        return;
    }


    if (dragging) {
        return;
    }


    const disk =
        e.currentTarget;


    const from =
        parseInt(
            disk.dataset.rod
        );


    const size =
        parseInt(
            disk.dataset.size
        );


    /*
     * 安全检查
     */

    const top =
        towers[from][
            towers[from].length - 1
        ];


    if (top !== size) {
        return;
    }


    /*
     * 开始计时
     */

    if (
        moves === 0 &&
        !startTime
    ) {

        startTimer();

    }


    dragging = true;

    dragDisk = disk;

    dragFrom = from;

    dragPointerId =
        e.pointerId;


    const rect =
        disk.getBoundingClientRect();

    const boardRect =
        board.getBoundingClientRect();


    /*
     * 圆盘原来的位置
     */

    const x =
        e.clientX -
        boardRect.left -
        rect.width / 2;


    const y =
        e.clientY -
        boardRect.top -
        rect.height / 2;


    /*
     * 从原来的 DOM 中取出来
     */

    disk.remove();


    document
        .getElementById(
            "dragLayer"
        )
        .appendChild(
            disk
        );


    disk.classList.add(
        "dragging"
    );


    disk.style.position =
        "absolute";


    disk.style.left =
        x + "px";


    disk.style.top =
        y + "px";


    disk.style.margin =
        "0";


    /*
     * 原柱减少一个盘
     */

    towers[from].pop();


    render();


    /*
     * 捕获手指
     */

    try {

        board.setPointerCapture(
            e.pointerId
        );

    } catch (err) {}


    showMessage(
        "✋ 拖动中……把圆盘移动到目标柱",
        "good"
    );


    updateDropTarget(
        e.clientX,
        e.clientY
    );


    e.preventDefault();

}


/* =========================================================
   拖动
========================================================= */

function moveDrag(e) {

    if (
        !dragging ||
        e.pointerId !==
            dragPointerId
    ) {
        return;
    }


    const boardRect =
        board.getBoundingClientRect();


    const rect =
        dragDisk.getBoundingClientRect();


    let x =
        e.clientX -
        boardRect.left -
        rect.width / 2;


    let y =
        e.clientY -
        boardRect.top -
        rect.height / 2;


    /*
     * 限制在棋盘内
     */

    x = Math.max(
        2,
        Math.min(
            board.clientWidth -
            rect.width -
            2,
            x
        )
    );


    y = Math.max(
        2,
        Math.min(
            board.clientHeight -
            rect.height -
            2,
            y
        )
    );


    dragDisk.style.left =
        x + "px";


    dragDisk.style.top =
        y + "px";


    updateDropTarget(
        e.clientX,
        e.clientY
    );


    e.preventDefault();

}


/* =========================================================
   判断目标柱
========================================================= */

function getTargetRod(
    clientX,
    clientY
) {

    const areas =
        document.querySelectorAll(
            ".rod-area"
        );


    for (
        let i = 0;
        i < areas.length;
        i++
    ) {

        const rect =
            areas[i]
                .getBoundingClientRect();


        /*
         * 横向扩大目标区域
         *
         * 手机拖拽更容易
         */

        const extraX =
            window.innerWidth <= 700
                ? 25
                : 45;


        if (
            clientX >=
                rect.left -
                extraX &&

            clientX <=
                rect.right +
                extraX &&

            clientY >=
                rect.top &&

            clientY <=
                rect.bottom
        ) {

            return i;

        }

    }


    return -1;

}


/* =========================================================
   更新目标
========================================================= */

function updateDropTarget(
    clientX,
    clientY
) {

    clearDropTargets();


    const target =
        getTargetRod(
            clientX,
            clientY
        );


    if (
        target === -1 ||
        target === dragFrom
    ) {

        currentTarget = -1;

        return;

    }


    const size =
        parseInt(
            dragDisk.dataset.size
        );


    const top =
        towers[target][
            towers[target].length - 1
        ];


    /*
     * 合法
     */

    if (
        top === undefined ||
        size < top
    ) {

        currentTarget =
            target;


        const area =
            document.querySelector(
                `.rod-area[data-rod="${target}"]`
            );


        area.classList.add(
            "drop-target"
        );


        showMessage(
            "✓ 可以放到 " +
            ["A","B","C"][target] +
            " 柱",
            "good"
        );

    }

    /*
     * 不合法
     */

    else {

        currentTarget = -1;


        showMessage(
            "❌ 大圆盘不能放在小圆盘上",
            "bad"
        );

    }

}


/* =========================================================
   清除目标
========================================================= */

function clearDropTargets() {

    document
        .querySelectorAll(
            ".rod-area"
        )
        .forEach(
            el =>
                el.classList.remove(
                    "drop-target"
                )
        );

}


/* =========================================================
   松手
========================================================= */

function endDrag(e) {

    if (
        !dragging ||
        e.pointerId !==
            dragPointerId
    ) {
        return;
    }


    const target =
        currentTarget;


    clearDropTargets();


    if (
        target !== -1 &&
        target !== dragFrom
    ) {

        completeDrag(
            target
        );

    }

    else {

        cancelDrag();

    }


    dragging = false;

    dragPointerId = null;


    try {

        board.releasePointerCapture(
            e.pointerId
        );

    } catch (err) {}


    e.preventDefault();

}


/* =========================================================
   完成移动
========================================================= */

function completeDrag(
    target
) {

    const size =
        parseInt(
            dragDisk.dataset.size
        );


    /*
     * 保存历史
     */

    history.push(
        JSON.stringify(
            towers
        )
    );


    /*
     * 放入目标柱
     */

    towers[target].push(
        size
    );


    moves++;


    updateStats();


    /*
     * 删除浮动盘
     */

    dragDisk.remove();

    dragDisk = null;


    render();


    showMessage(
        "✓ 圆盘 " +
        size +
        " → " +
        ["A","B","C"][target],
        "good"
    );


    /*
     * 胜利
     */

    if (
        towers[2].length ===
        diskCount
    ) {

        finishGame();

    }

}


/* =========================================================
   取消
========================================================= */

function cancelDrag() {

    const size =
        parseInt(
            dragDisk.dataset.size
        );


    towers[dragFrom].push(
        size
    );


    dragDisk.remove();

    dragDisk = null;


    render();


    showMessage(
        "↩️ 圆盘已放回原位置",
        "bad"
    );

}


/* =========================================================
   Pointer Move
========================================================= */

board.addEventListener(
    "pointermove",
    moveDrag,
    {
        passive: false
    }
);


/* =========================================================
   Pointer Up
========================================================= */

board.addEventListener(
    "pointerup",
    endDrag,
    {
        passive: false
    }
);


/* =========================================================
   Pointer Cancel
========================================================= */

board.addEventListener(
    "pointercancel",
    endDrag,
    {
        passive: false
    }
);


/* =========================================================
   计时
========================================================= */

function startTimer() {

    startTime =
        Date.now();


    clearInterval(timer);


    timer =
        setInterval(
            () => {

                if (!startTime) {
                    return;
                }


                const seconds =
                    Math.floor(
                        (
                            Date.now() -
                            startTime
                        ) / 1000
                    );


                updateTime(
                    seconds
                );

            },
            1000
        );

}


/* =========================================================
   时间
========================================================= */

function updateTime(
    seconds
) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const sec =
        seconds % 60;


    const text =
        String(minutes)
            .padStart(2,"0") +
        ":" +
        String(sec)
            .padStart(2,"0");


    document.getElementById(
        "time"
    ).textContent =
        text;


    document.getElementById(
        "mobileTime"
    ).textContent =
        text;

}


/* =========================================================
   更新数据
========================================================= */

function updateStats() {

    document.getElementById(
        "moves"
    ).textContent =
        moves;


    document.getElementById(
        "mobileMoves"
    ).textContent =
        moves;

}


/* =========================================================
   撤销
========================================================= */

function undoMove() {

    if (dragging) {
        return;
    }


    if (
        history.length === 0
    ) {

        showMessage(
            "目前没有可以撤销的操作"
        );

        return;

    }


    towers =
        JSON.parse(
            history.pop()
        );


    moves--;


    if (moves < 0) {
        moves = 0;
    }


    updateStats();


    /*
     * 如果完全撤销
     */

    if (moves === 0) {

        clearInterval(timer);

        startTime = null;


        document.getElementById(
            "time"
        ).textContent =
            "00:00";


        document.getElementById(
            "mobileTime"
        ).textContent =
            "00:00";

    }


    render();


    showMessage(
        "↩️ 已撤销一步"
    );

}


/* =========================================================
   完成游戏
========================================================= */

function finishGame() {

    gameFinished = true;


    clearInterval(timer);


    const finalTime =
        document.getElementById(
            "time"
        ).textContent;


    document.getElementById(
        "winMoves"
    ).textContent =
        moves;


    document.getElementById(
        "winMinimum"
    ).textContent =
        Math.pow(
            2,
            diskCount
        ) - 1;


    document.getElementById(
        "winTime"
    ).textContent =
        finalTime;


    setTimeout(
        () => {

            winOverlay.classList.add(
                "show"
            );

        },
        220
    );

}


/* =========================================================
   提示
========================================================= */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =========================================================
   重新开始
========================================================= */

function restartGame() {

    initGame();

}


/* =========================================================
   PC 圆盘数量
========================================================= */

document
    .getElementById(
        "diskCount"
    )
    .addEventListener(
        "change",
        function() {

            document.getElementById(
                "mobileDiskCount"
            ).value =
                this.value;

            restartGame();

        }
    );


/* =========================================================
   手机圆盘数量
========================================================= */

document
    .getElementById(
        "mobileDiskCount"
    )
    .addEventListener(
        "change",
        function() {

            document.getElementById(
                "diskCount"
            ).value =
                this.value;

            restartGame();

        }
    );


/* =========================================================
   PC 按钮
========================================================= */

document
    .getElementById(
        "restartBtn"
    )
    .addEventListener(
        "click",
        restartGame
    );


document
    .getElementById(
        "undoBtn"
    )
    .addEventListener(
        "click",
        undoMove
    );


/* =========================================================
   手机按钮
========================================================= */

document
    .getElementById(
        "mobileRestartBtn"
    )
    .addEventListener(
        "click",
        restartGame
    );


document
    .getElementById(
        "mobileUndoBtn"
    )
    .addEventListener(
        "click",
        undoMove
    );


/* =========================================================
   胜利按钮
========================================================= */

document
    .getElementById(
        "winRestartBtn"
    )
    .addEventListener(
        "click",
        restartGame
    );


/* =========================================================
   防止浏览器手势干扰
========================================================= */

document.addEventListener(
    "gesturestart",
    function(e) {
        e.preventDefault();
    },
    {
        passive: false
    }
);


/* =========================================================
   启动
========================================================= */

initGame();

</script>

</body>

</html>

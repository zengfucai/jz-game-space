<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2048 - JZ 游戏空间</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #0b0d10;

            color: white;

            font-family:
                "Microsoft YaHei",
                sans-serif;
        }

        .game {
            text-align: center;
        }

        h1 {
            font-size: 60px;

            margin-bottom: 10px;
        }

        p {
            color: #777;
        }

        button {
            margin-top: 20px;

            padding: 12px 25px;

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="game">

    <h1>2048</h1>

    <p>游戏正在开发中...</p>

    <button onclick="history.back()">
        ← 返回游戏空间
    </button>

</div>

</body>

</html>
